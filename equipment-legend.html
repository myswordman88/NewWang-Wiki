<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>传奇装备 & 混沌装备 | 新王觉醒</title>
  <meta name="description" content="新王觉醒 Mod 装备详情：传奇装备 & 混沌装备——超越暗金与混沌的顶级品质，毕业装备之选。" />
  <meta name="author" content="新王觉醒" />
  <meta name="theme-color" content="#0a0a0f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div id="site-nav"></div>

  <main id="main">
    <section class="section detail feature">
      <div class="container">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="index.html">首页</a><span aria-hidden="true">/</span>
          <a href="index.html#equipment">装备详情</a><span aria-hidden="true">/</span>
          <span class="current">传奇装备 & 混沌装备</span>
        </nav>

        <header class="section-head reveal">
          <p class="section-kicker">装备详情 | <span class="kicker-num">5 · 8</span></p>
          <h2>传奇装备 & 混沌装备</h2>
          <p class="section-lead">超越暗金的传奇品质，顶级毕业装备。</p>
        </header>

        <article class="feature-section reveal unique-page">
        <!-- 搜索栏：右侧按钮顺序 = 筛选 / 级别筛选 / 排序 -->
        <div class="unique-search-wrap">
          <span class="unique-search-icon" aria-hidden="true">&#9906;</span>
          <input type="search" id="uniqueSearch" class="unique-search-input" placeholder="搜索传奇装备的名称、底材、属性…" autocomplete="off" aria-label="搜索传奇装备名称" />
          <button type="button" class="unique-filter-toggle" id="uniqueFilterToggle" aria-expanded="false">
            筛选 <span class="caret" aria-hidden="true">▾</span>
          </button>
          <label class="unique-field">
            <span class="unique-field-label">级别</span>
            <select id="uniqueTier" aria-label="按级别筛选">
              <option value="">全部</option>
              <option value="普通">普通</option>
              <option value="扩展">扩展</option>
              <option value="精英">精英</option>
              <option value="任务">任务</option>
            </select>
          </label>
          <div class="unique-sort-control" id="uniqueSortControl">
            <button type="button" class="unique-sort-dir" id="uniqueSortDir" aria-label="切换升序/降序" title="切换升序/降序">
              <span class="unique-sort-dir-icon" aria-hidden="true">↕</span>
            </button>
            <button type="button" class="unique-sort-trigger" id="uniqueSortTrigger" aria-haspopup="true" aria-expanded="false">
              <span class="unique-sort-label">排序</span>
              <span class="unique-sort-arrow" aria-hidden="true">▼</span>
            </button>
            <div class="unique-sort-menu" id="uniqueSortMenu" role="menu" aria-labelledby="uniqueSortTrigger" hidden></div>
          </div>
        </div>

        <!-- 筛选面板 -->
        <div class="unique-filter-panel" id="uniqueFilterPanel" hidden>
          <div class="unique-filter-row unique-filter-main" id="uniqueCategoryFilter"></div>
          <div class="unique-filter-row unique-filter-sub" id="uniqueSubtypeFilter"></div>
        </div>

        <!-- 计数（搜索后动态出现的「按属性排序」保持在此处） -->
        <div class="unique-toolbar">
          <p class="unique-count" id="uniqueListCount" aria-live="polite"></p>
          <div class="unique-tools">
            <button type="button" class="unique-propsort-btn" id="uniquePropSortBtn" hidden>
              <span class="unique-propsort-label">按属性排序</span>
              <span class="unique-propsort-dir" aria-hidden="true">↓</span>
            </button>
          </div>
        </div>

          <!-- 卡片网格 -->
          <div class="unique-grid" id="uniqueGrid"></div>
          <p class="unique-empty" id="uniqueListEmpty" hidden>没有匹配的传奇装备，试试调整筛选条件。</p>
        </article>

        <a class="btn btn-ghost detail-back" href="index.html">← 返回首页</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./js/legend-items.js" defer></script>
  <script src="./js/legend-db.js" defer></script>

  <script src="./js/shared.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
