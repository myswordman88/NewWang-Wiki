<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>基底装备 | 新王觉醒</title>
  <meta name="description" content="新王觉醒 Mod 装备详情：基底装备——介于普通与魔法之间的基底品质，分普通、扩展、精英三档，入门过渡的优选。" />
  <meta name="author" content="新王觉醒" />
  <meta name="theme-color" content="#0a0a0f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div id="site-nav"></div>

  <main id="main">
    <section class="section detail feature">
      <div class="container">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="index.html">首页</a><span aria-hidden="true">/</span>
          <a href="index.html#equipment">装备详情</a><span aria-hidden="true">/</span>
          <span class="current">基底装备</span>
        </nav>

        <header class="section-head reveal">
          <p class="section-kicker">装备详情 | <span class="kicker-num">5 · 2</span></p>
          <h2>基底装备</h2>
          <p class="section-lead">游戏内全部基底装备的数据总览，支持按名称搜索、分类与级别筛选、属性排序。</p>
        </header>

        <article class="feature-section reveal">
          <div class="base-db" id="baseDb">
            <div class="base-tabs" id="baseTabs" role="tablist" aria-label="装备类型">
              <button type="button" class="base-tab active" role="tab" aria-selected="true" data-view="armor">防具</button>
              <button type="button" class="base-tab" role="tab" aria-selected="false" data-view="weapon">武器</button>
            </div>
            <div class="base-toolbar">
              <div class="base-search">
                <span class="base-search-icon" aria-hidden="true">&#9906;</span>
                <input type="search" id="baseSearch" placeholder="搜索名称 / 译名 / 英文名…" autocomplete="off" aria-label="搜索基底装备" />
              </div>
              <div class="base-filters">
                <label class="base-field">
                  <span>分类</span>
                  <select id="baseCat" aria-label="按分类筛选"></select>
                </label>
                <label class="base-field">
                  <span>级别</span>
                  <select id="baseTier" aria-label="按级别筛选"></select>
                </label>
                <div class="base-field base-sort-field">
                  <span>排序</span>
                  <div class="base-sort-control" id="baseSortControl">
                    <button type="button" class="base-sort-dir" id="baseSortDir" aria-label="切换升序/降序" title="切换升序/降序">
                      <span class="base-sort-dir-icon" aria-hidden="true">↕</span>
                    </button>
                    <button type="button" class="base-sort-trigger" id="baseSortTrigger" aria-haspopup="true" aria-expanded="false">
                      <span class="base-sort-label">排序</span>
                      <span class="base-sort-arrow" aria-hidden="true">▼</span>
                    </button>
                    <div class="base-sort-menu" id="baseSortMenu" role="menu" aria-labelledby="baseSortTrigger" hidden></div>
                  </div>
                </div>
              </div>
            </div>

            <div class="base-quick-filters" id="baseQuickFilters" aria-label="快捷分类筛选"></div>

            <p class="base-count" id="baseCount" aria-live="polite"></p>

            <div class="base-grid" id="baseGrid"></div>
            <p class="base-empty" id="baseEmpty" hidden>没有匹配的基底装备，试试调整筛选条件。</p>
          </div>
        </article>

        <a class="btn btn-ghost detail-back" href="index.html">← 返回首页</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./js/base-items.js" defer></script>
  <script src="./js/weapon-items.js" defer></script>
  <script src="./js/base-db.js" defer></script>
  
  <script src="./js/shared.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
