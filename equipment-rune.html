<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>符文之语 | 新王觉醒</title>
  <meta name="description" content="新王觉醒 Mod 装备详情：符文之语——以符文镶嵌词缀组合，触发隐藏强力的符文之语装备。" />
  <meta name="author" content="新王觉醒" />
  <meta name="theme-color" content="#0a0a0f" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+SC:wght@600;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <a class="skip-link" href="#main">跳到主要内容</a>

  <div id="site-nav"></div>

  <main id="main">
    <section class="section detail feature">
      <div class="container">
        <nav class="breadcrumb" aria-label="面包屑">
          <a href="index.html">首页</a><span aria-hidden="true">/</span>
          <a href="index.html#equipment">装备详情</a><span aria-hidden="true">/</span>
          <span class="current">符文之语</span>
        </nav>

        <header class="section-head reveal">
          <p class="section-kicker">装备详情 | <span class="kicker-num">5 · 5</span></p>
          <h2>符文之语</h2>
          <p class="section-lead">以符文镶嵌词缀组合，触发隐藏强力的符文之语装备。</p>
        </header>

        <article class="feature-section reveal rune-page">
          <!-- 搜索栏 -->
          <div class="rune-search-wrap">
            <span class="rune-search-icon" aria-hidden="true">&#9906;</span>
            <input type="search" id="runeSearch" class="rune-search-input" placeholder="搜索符文之语的名称、译名、属性…" autocomplete="off" aria-label="搜索符文之语名称" />
            <button type="button" class="rune-filter-toggle" id="runeFilterToggle" aria-expanded="false">
              筛选 <span class="caret" aria-hidden="true">▾</span>
            </button>
          </div>

          <!-- 筛选面板 -->
          <div class="rune-filter-panel" id="runeFilterPanel" hidden>
            <div class="rune-filter-row rune-filter-main" id="runeCategoryFilter"></div>
            <div class="rune-filter-row rune-filter-sub" id="runeSubtypeFilter"></div>
            <div class="rune-filter-row rune-filter-sockets" id="runeSocketFilter"></div>
          </div>

          <!-- 计数 / 排序（分体按钮：左箭头控制逆序，右选择按需要等级） -->
          <div class="rune-toolbar">
            <p class="rune-count" id="runeListCount" aria-live="polite"></p>
            <div class="rune-tools">
              <div class="rune-sort-control" id="runeSortControl">
                <button type="button" class="rune-sort-dir" id="runeSortDir" aria-label="切换升序/降序" title="切换升序/降序">
                  <span class="rune-sort-dir-icon" aria-hidden="true">↕</span>
                </button>
                <button type="button" class="rune-sort-trigger" id="runeSortTrigger" aria-haspopup="true" aria-expanded="false">
                  <span class="rune-sort-label">需要等级</span>
                  <span class="rune-sort-arrow" aria-hidden="true">▼</span>
                </button>
                <div class="rune-sort-menu" id="runeSortMenu" role="menu" aria-labelledby="runeSortTrigger" hidden></div>
              </div>
              <button type="button" class="rune-propsort-btn" id="runePropSortBtn" hidden>
                <span class="rune-propsort-label">按属性排序</span>
                <span class="rune-propsort-dir" aria-hidden="true">↓</span>
              </button>
            </div>
          </div>

          <!-- 卡片网格 -->
          <div class="rune-grid" id="runeGrid"></div>
          <p class="rune-empty" id="runeListEmpty" hidden>没有匹配的符文之语，试试调整筛选条件。</p>
        </article>

        <a class="btn btn-ghost detail-back" href="index.html">← 返回首页</a>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>

  <script src="./js/runewords-items.js" defer></script>
  <script src="./js/rune-db.js" defer></script>

  <script src="./js/shared.js" defer></script>
  <script src="./js/main.js" defer></script>
</body>
</html>
